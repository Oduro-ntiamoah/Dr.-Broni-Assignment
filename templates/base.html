<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESCA Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f1117;
            color: #e4e6eb;
            margin: 0;
        }
        nav {
            background: #171a23;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            border-bottom: 1px solid #2a2e3a;
        }
        nav .brand { font-weight: 700; font-size: 18px; color: #6ee7b7; }
        nav a {
            color: #cbd2e0;
            text-decoration: none;
            font-size: 14px;
        }
        nav a:hover { color: #6ee7b7; }
        main { padding: 24px; max-width: 1100px; margin: 0 auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #171a23;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid #2a2e3a;
            font-size: 14px;
        }
        th { background: #1e2230; color: #9aa3b5; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-allowed { background: #14382a; color: #6ee7b7; }
        .badge-violation { background: #3a1a1a; color: #f87171; }
        .badge-heartbeat { background: #1e2a3a; color: #7dd3fc; }
        .badge-online { background: #14382a; color: #6ee7b7; }
        .badge-offline { background: #2a2e3a; color: #9aa3b5; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .flash-success { background: #14382a; color: #6ee7b7; }
        .flash-error { background: #3a1a1a; color: #f87171; }
        h1 { font-size: 20px; margin-bottom: 20px; }
        form.inline { display: inline; }
        input, button {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2a2e3a;
            background: #1e2230;
            color: #e4e6eb;
        }
        button {
            background: #22c55e;
            color: #0f1117;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        button.danger { background: #ef4444; color: white; }
        button:hover { opacity: 0.9; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; margin-bottom: 4px; color: #9aa3b5; font-size: 13px; }
        code { background: #1e2230; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">ESCA</span>
        <a href="{{ url_for('devices_view') }}">Devices</a>
        <a href="{{ url_for('events_view') }}">Event Log</a>
        <a href="{{ url_for('allowlist_view') }}">Allowlist</a>
        <a href="{{ url_for('hash_tool') }}">Hash Tool</a>
    </nav>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
